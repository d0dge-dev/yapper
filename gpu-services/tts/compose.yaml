# GPU text-to-speech for Yapper (Qwen3-TTS 1.7B via faster-qwen3-tts). Needs Docker with the NVIDIA container toolkit.
#   docker compose up -d --build      then in Yapper's .env:  YAP_TTS=gpu  YAP_GPU_TTS_URL=http://<this-host>:8800
# No auth: publish it only on a trusted network (or bind it to 127.0.0.1 if Yapper runs on the same host).
services:
  tts:
    build: .
    image: yapper-tts
    container_name: yapper-tts
    restart: unless-stopped
    ports:
      - "8800:8800"
    environment:
      TTS_MODEL: Qwen/Qwen3-TTS-12Hz-1.7B-Base
      # Default voice per language (reference clips in ./voices, baked into the image).
      TTS_VOICE_DE: design-m
      TTS_VOICE_EN: en-m
    volumes:
      - ./data:/data  # Hugging Face cache (HF_HOME=/data/hf)
      # - ./voices:/voices:ro  # mount instead of baking, to add voices without a rebuild
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8800/health"]
      interval: 30s
      timeout: 5s
      start_period: 300s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
